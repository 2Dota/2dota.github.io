<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dota 2 Item Wiki</title>
    <script>
      // GitHub Pages SPA routing: redirect any deep link back to index.html
      // preserving the path so React Router can handle it.
      var segmentCount = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
