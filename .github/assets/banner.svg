<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070a0f"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fb7185"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fb7185"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fb7185;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#fb7185;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="headline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fb7185"/>
      <stop offset="55%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#fb7185"/>
    </linearGradient>
    <filter id="glowblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="rounded">
      <rect width="900" height="280" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Dark background -->
    <rect width="900" height="280" fill="url(#bg)"/>

    <!-- Grid lines horizontal -->
    <line x1="0" y1="56" x2="900" y2="56" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    <line x1="0" y1="112" x2="900" y2="112" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    <line x1="0" y1="168" x2="900" y2="168" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    <line x1="0" y1="224" x2="900" y2="224" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>

    <!-- Grid lines vertical -->
    <line x1="112" y1="0" x2="112" y2="280" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    <line x1="225" y1="0" x2="225" y2="280" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    <line x1="337" y1="0" x2="337" y2="280" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="280" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    <line x1="562" y1="0" x2="562" y2="280" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    <line x1="675" y1="0" x2="675" y2="280" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    <line x1="787" y1="0" x2="787" y2="280" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>

    <!-- Radial glow behind headline -->
    <ellipse cx="450" cy="90" rx="340" ry="100" fill="url(#glow)" filter="url(#softblur)"/>

    <!-- Amber side glow right -->
    <ellipse cx="800" cy="180" rx="160" ry="80" fill="rgba(251,191,36,0.06)" filter="url(#softblur)"/>

    <!-- Purple glow left -->
    <ellipse cx="100" cy="200" rx="120" ry="70" fill="rgba(139,92,246,0.06)" filter="url(#softblur)"/>

    <!-- Top accent gradient line -->
    <rect x="0" y="0" width="900" height="2" fill="url(#accent)"/>

    <!-- Eyebrow pill badge -->
    <rect x="359" y="44" width="182" height="28" rx="14" fill="rgba(251,113,133,0.1)" stroke="rgba(251,113,133,0.28)" stroke-width="1"/>
    <!-- Sword icon dots decoration -->
    <circle cx="379" cy="58" r="3" fill="rgba(251,113,133,0.7)"/>
    <line x1="379" y1="50" x2="379" y2="67" stroke="rgba(251,113,133,0.5)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="375" y1="57" x2="383" y2="57" stroke="rgba(251,113,133,0.5)" stroke-width="1.5" stroke-linecap="round"/>
    <text x="450" y="63" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#fb7185" text-anchor="middle" letter-spacing="2.5">DOTA 2 WIKI</text>

    <!-- Main headline line 1 -->
    <text x="450" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="46" font-weight="800" fill="url(#headline)" text-anchor="middle" letter-spacing="-1.5">The Knowledge Base</text>

    <!-- Subtitle -->
    <text x="450" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="14.5" fill="rgba(156,163,175,0.9)" text-anchor="middle" letter-spacing="0.2">In-game shop guide and neutral items reference, built for serious players</text>

    <!-- Separator line -->
    <line x1="350" y1="170" x2="550" y2="170" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Stat chip 1: Shop Items -->
    <rect x="155" y="186" width="130" height="34" rx="17" fill="rgba(251,113,133,0.08)" stroke="rgba(251,113,133,0.2)" stroke-width="1"/>
    <circle cx="175" cy="203" r="4" fill="rgba(251,113,133,0.7)"/>
    <text x="213" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="rgba(251,113,133,0.95)" text-anchor="middle">94 Shop Items</text>

    <!-- Stat chip 2: Neutral Items -->
    <rect x="302" y="186" width="140" height="34" rx="17" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
    <circle cx="322" cy="203" r="4" fill="rgba(251,191,36,0.7)"/>
    <text x="365" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="rgba(251,191,36,0.95)" text-anchor="middle">43 Neutral Items</text>

    <!-- Stat chip 3: Categories -->
    <rect x="459" y="186" width="130" height="34" rx="17" fill="rgba(96,165,250,0.08)" stroke="rgba(96,165,250,0.2)" stroke-width="1"/>
    <circle cx="479" cy="203" r="4" fill="rgba(96,165,250,0.7)"/>
    <text x="517" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="rgba(96,165,250,0.95)" text-anchor="middle">9 Categories</text>

    <!-- Stat chip 4: Neutral Tiers -->
    <rect x="606" y="186" width="140" height="34" rx="17" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
    <circle cx="626" cy="203" r="4" fill="rgba(52,211,153,0.7)"/>
    <text x="669" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="rgba(52,211,153,0.95)" text-anchor="middle">5 Neutral Tiers</text>

    <!-- Bottom URL -->
    <text x="450" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="11" fill="rgba(75,85,99,0.8)" text-anchor="middle" letter-spacing="0.5">2dota.github.io</text>

    <!-- Bottom border -->
    <rect x="0" y="277" width="900" height="3" fill="url(#accent)" opacity="0.3"/>
  </g>
</svg>
