    <line x1="275" y1="382" x2="365" y2="352" stroke="rgba(251,191,36,0.2)" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="445" y1="382" x2="365" y2="352" stroke="rgba(251,191,36,0.15)" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="615" y1="382" x2="530" y2="352" stroke="rgba(52,211,153,0.2)" stroke-width="1" stroke-dasharray="2,3"/>
