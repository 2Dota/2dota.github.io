    <line x1="0" y1="140" x2="860" y2="140" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    <line x1="0" y1="220" x2="860" y2="220" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    <line x1="0" y1="300" x2="860" y2="300" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    <line x1="0" y1="380" x2="860" y2="380" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    <line x1="215" y1="0" x2="215" y2="420" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    <line x1="430" y1="0" x2="430" y2="420" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    <line x1="645" y1="0" x2="645" y2="420" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

    <!-- Title -->
    <text x="430" y="36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="rgba(156,163,175,0.8)" text-anchor="middle" letter-spacing="2">PROJECT ARCHITECTURE</text>

