    <rect x="370" y="382" width="150" height="30" rx="6" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
    <text x="445" y="401" font-family="-apple-system,BlinkMacSystemFont,monospace,sans-serif" font-size="11" font-weight="600" fill="rgba(251,191,36,0.8)" text-anchor="middle">shopMeta.ts</text>

    <!-- neutralItems.ts -->
    <rect x="540" y="382" width="150" height="30" rx="6" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.25)" stroke-width="1"/>
    <text x="615" y="401" font-family="-apple-system,BlinkMacSystemFont,monospace,sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">neutralItems.ts</text>

