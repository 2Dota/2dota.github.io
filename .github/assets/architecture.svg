    <line x1="115" y1="216" x2="840" y2="216" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="115" y1="296" x2="840" y2="296" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4,4"/>
