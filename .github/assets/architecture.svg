    <text x="430" y="86" font-family="-apple-system,BlinkMacSystemFont,monospace,sans-serif" font-size="12" font-weight="700" fill="#fb7185" text-anchor="middle">main.tsx</text>
    <text x="430" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="10" fill="rgba(156,163,175,0.7)" text-anchor="middle">React 19 entry point</text>

