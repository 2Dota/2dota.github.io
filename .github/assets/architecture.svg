    <!-- Layer: Data -->
    <text x="24" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="rgba(75,85,99,0.9)" letter-spacing="1.5">DATA</text>

