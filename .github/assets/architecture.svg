    <!-- shopItems.ts -->
    <rect x="200" y="382" width="150" height="30" rx="6" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
    <text x="275" y="401" font-family="-apple-system,BlinkMacSystemFont,monospace,sans-serif" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">shopItems.ts</text>

