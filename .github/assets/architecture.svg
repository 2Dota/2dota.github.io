    <text x="200" y="326" font-family="-apple-system,BlinkMacSystemFont,monospace,sans-serif" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">HomePage.tsx</text>
    <text x="200" y="342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="10" fill="rgba(156,163,175,0.7)" text-anchor="middle">/</text>

