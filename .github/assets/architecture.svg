    <rect x="625" y="308" width="140" height="44" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="695" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="rgba(75,85,99,0.9)" text-anchor="middle">Future Pages</text>
    <text x="695" y="342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="10" fill="rgba(75,85,99,0.7)" text-anchor="middle">heroes, patches...</text>

    <!-- Arrows Pages -> Layout -->
    <line x1="200" y1="308" x2="350" y2="272" stroke="rgba(192,132,252,0.2)" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="365" y1="308" x2="410" y2="272" stroke="rgba(251,191,36,0.2)" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="530" y1="308" x2="460" y2="272" stroke="rgba(52,211,153,0.2)" stroke-width="1" stroke-dasharray="2,3"/>

