    <!-- Layer: Layout -->
    <text x="24" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="rgba(75,85,99,0.9)" letter-spacing="1.5">LAYOUT</text>
    <!-- Layer: Pages -->
