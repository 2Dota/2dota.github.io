    <rect x="460" y="308" width="140" height="44" rx="8" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.3)" stroke-width="1.5"/>
    <text x="530" y="326" font-family="-apple-system,BlinkMacSystemFont,monospace,sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">NeutralItems.tsx</text>
    <text x="530" y="342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="10" fill="rgba(156,163,175,0.7)" text-anchor="middle">/neutral</text>

