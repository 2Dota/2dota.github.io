    <marker id="arrowblue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="rgba(96,165,250,0.6)"/>
    </marker>
  </defs>

  <g clip-path="url(#clip)">
