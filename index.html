<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The complete Dota 2 cosmetics wiki. Every Arcana, Persona, Immortal, Courier, Terrain and store item with full descriptions, official artwork and availability status." />
    <meta name="keywords" content="Dota 2, cosmetics, arcana, persona, immortal, store, wiki, items" />
    <meta property="og:title" content="Dota 2 Item Wiki" />
    <meta property="og:description" content="Every cosmetic item in the Dota 2 store. Complete reference with official artwork." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#030712" />
    <title>Dota 2 Item Wiki</title>
    <script>
      // GitHub Pages SPA routing: restore path stored by 404.html
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
